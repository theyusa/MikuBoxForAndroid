name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0) - Leave empty for artifacts only'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GO_VERSION: '^1.25'

jobs:
  build-libcore:
    name: Build LibCore (Native)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate status files for cache
        run: |
          find buildScript libcore/*.sh -type f 2>/dev/null | xargs cat | sha1sum > golang_status || echo "no-buildscript" > golang_status
          git ls-files libcore 2>/dev/null | xargs cat | sha1sum > libcore_status || echo "no-libcore" > libcore_status

      - name: Restore LibCore cache
        id: cache-libcore
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('golang_status', 'libcore_status') }}

      - name: Setup Golang
        if: steps.cache-libcore.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build LibCore
        if: steps.cache-libcore.outputs.cache-hit != 'true'
        run: |
          chmod +x run
          ./run lib core

      - name: Upload LibCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          retention-days: 1

  build-apk:
    name: Build APK (Unsigned)
    needs: build-libcore
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate status files
        run: |
          find buildScript libcore/*.sh -type f 2>/dev/null | xargs cat | sha1sum > golang_status || echo "no-buildscript" > golang_status
          git ls-files libcore 2>/dev/null | xargs cat | sha1sum > libcore_status || echo "no-libcore" > libcore_status

      - name: Restore LibCore cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('golang_status', 'libcore_status') }}

      - name: Download LibCore artifact (fallback)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: libcore-aar
          path: app/libs/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Suppress Java deprecation warnings
        run: |
          echo "android.javaCompile.suppressSourceTargetDeprecationWarning=true" >> gradle.properties

      - name: Build APK (Debug/Unsigned)
        env:
          BUILD_PLUGIN: none
          _JAVA_OPTIONS: "-Xmx3g -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew
          chmod +x run
          ./run init action gradle
          
          # Build all variants
          ./gradlew app:assemblePreviewDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            --stacktrace
          
          # Verify APK creation
          echo "🔍 Searching for APK files..."
          find app/build/outputs/apk -type f -name "*.apk"
          
          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No APK files generated!"
            exit 1
          fi
          
          echo "✅ Successfully built $APK_COUNT APK(s)"

      - name: List APK details
        run: |
          echo "📦 APK Files:"
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} release-apks/ \;
          
          echo "📦 Prepared APKs:"
          ls -lh release-apks/

      # ============================================
      # ARTIFACTS UPLOAD (No ZIP, direct APKs)
      # ============================================
      - name: Upload APKs as artifacts
        if: github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: release-apks/*.apk
          retention-days: 7
          compression-level: 0

      # ============================================
      # GITHUB RELEASE (Direct APKs)
      # ============================================
      - name: Create GitHub Release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          body: |
            ## 🚀 Release ${{ github.event.inputs.release_tag }}
            
            ### 📱 Download APKs
            **Note**: These are unsigned debug builds.
            
            Choose the APK for your device:
            - **arm64-v8a** - Modern 64-bit ARM devices (Most common) ⭐
            - **armeabi-v7a** - Older 32-bit ARM devices
            - **x86** - Intel/AMD 32-bit devices
            - **x86_64** - Intel/AMD 64-bit devices  
            - **universal** - Works on all architectures (larger size)
            
            ### ℹ️ Build Information
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Date**: ${{ github.event.repository.updated_at }}
            - **Java**: ${{ env.JAVA_VERSION }}
            - **Go**: ${{ env.GO_VERSION }}
            
            ### 📝 Installation Instructions
            1. Download the APK for your device architecture
            2. Enable "Install from Unknown Sources" in Android settings
            3. Open the APK file to install
            
            ### ⚠️ Important Notes
            - These are **unsigned debug builds**
            - Not signed with any keystore
            - May show security warnings during installation (this is normal)
            - For production use, please build signed release versions
            
            > **Tip**: If unsure which version to download, use the `universal` variant
          draft: false
          prerelease: false
          make_latest: true
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: github.event.inputs.release_tag != ''
        run: |
          echo "✅ Release created successfully!"
          echo "🏷️ Tag: ${{ github.event.inputs.release_tag }}"
          echo "📦 APKs uploaded to GitHub Releases"
          echo "🔗 View at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.release_tag }}"

      - name: Clean up
        if: always()
        run: |
          rm -rf release-apks
          
